appId: __UAT_MOBILE_APP_ID__
name: Coach Smoke
---
- stopApp
- launchApp

# Close Expo login/web modal if it appears.
- tapOn:
    point: "10%,13%"
    optional: true
- tapOn:
    text: "×"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd

# Close Expo dev menu if it is open.
- tapOn:
    point: "90%,10%"
    optional: true
- tapOn:
    text: "×"
    optional: true
- tapOn:
    text: "Go home"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "http://localhost:8081"
    optional: true

- waitForAnimationToEnd

- tapOn:
    text: "Continue"
    optional: true

- openLink: "wrestlewell://uat-reset"
- waitForAnimationToEnd

- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Log In"
    optional: true

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 25000

- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "__UAT_COACH_EMAIL__"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "__UAT_COACH_PASSWORD__"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "login-submit-button"

- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "OK"
    optional: true

- extendedWaitUntil:
    visible:
      id: "nav-plans"
    timeout: 25000
- assertVisible:
    id: "nav-plans"
- assertVisible:
    id: "nav-mat"
# Athlete Reflections
- openLink: "wrestlewell://coach-journal"
- extendedWaitUntil:
    visible: "Athlete Reflections"
    timeout: 25000

# Shared Goals
- openLink: "wrestlewell://coach-goals"
- extendedWaitUntil:
    visible:
      id: "coach-goals-screen"
    timeout: 25000

# Plans
- assertVisible:
    id: "nav-plans"
- openLink: "wrestlewell://practice-plans"
- extendedWaitUntil:
    visible: "Practice Plans"
    timeout: 25000

# Calendar
- assertVisible:
    id: "nav-schedule"
- openLink: "wrestlewell://calendar"
- extendedWaitUntil:
    visible: "Calendar"
    timeout: 25000

# Match-Day / Mat
- assertVisible:
    id: "nav-mat"
- openLink: "wrestlewell://mat-side"
- extendedWaitUntil:
    visible: "Mat-Side"
    timeout: 25000

# Alerts
- assertVisible:
    id: "nav-alerts"
- openLink: "wrestlewell://notifications"
- extendedWaitUntil:
    visible: "Alert Inbox"
    timeout: 25000

# Manual follow-up if stable:
# - open Match-Day
# - confirm Add Match and Import Bracket are visible
