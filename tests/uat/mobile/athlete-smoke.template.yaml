appId: __UAT_MOBILE_APP_ID__
name: Athlete Smoke
---
- stopApp
- launchApp

# Close Expo login/web modal if it appears.
- tapOn:
    point: "10%,13%"
    optional: true
- tapOn:
    text: "×"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd

# Close Expo dev menu if it is open.
- tapOn:
    point: "90%,10%"
    optional: true
- tapOn:
    text: "×"
    optional: true
- tapOn:
    text: "Go home"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "http://localhost:8081"
    optional: true

- waitForAnimationToEnd

- tapOn:
    text: "Continue"
    optional: true

- openLink: "wrestlewell://uat-reset"
- waitForAnimationToEnd

- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Log In"
    optional: true

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 25000

- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "__UAT_ATHLETE_EMAIL__"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "__UAT_ATHLETE_PASSWORD__"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "login-submit-button"

- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "OK"
    optional: true

- extendedWaitUntil:
    visible:
      id: "nav-events"
    timeout: 25000

- assertVisible:
    id: "nav-events"


- openLink: "wrestlewell://goals"
- extendedWaitUntil:
    visible: "Athlete Goals"
    timeout: 25000

# Session goal create
- scrollUntilVisible:
    element:
      id: "goal-add-session-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "goal-add-session-button"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "goal-title-input"
    direction: DOWN
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "goal-title-input"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "goal-title-input"
- eraseText
- inputText: "UAT Session Goal __UAT_TIMESTAMP__"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "goal-description-input"
    direction: DOWN
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "goal-description-input"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "goal-description-input"
- inputText: "Win more live goes this session __UAT_TIMESTAMP__"
- hideKeyboard
- tapOn:
    id: "goal-session-summer-button"
    optional: true
- tapOn:
    id: "goal-session-fall-button"
    optional: true
- tapOn:
    id: "goal-coach-visible-toggle"
- scrollUntilVisible:
    element:
      id: "goal-save-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "goal-save-button"
- extendedWaitUntil:
    visible: "UAT Session Goal __UAT_TIMESTAMP__"
    timeout: 25000

# Year goal create
- scrollUntilVisible:
    element:
      id: "goal-add-year-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "goal-add-year-button"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "goal-type-year-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "goal-type-year-button"
- tapOn:
    id: "goal-title-input"
- eraseText
- inputText: "UAT Year Goal __UAT_TIMESTAMP__"
- hideKeyboard
- tapOn:
    id: "goal-description-input"
- inputText: "Podium at the state qualifier __UAT_TIMESTAMP__"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "goal-save-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "goal-save-button"
- extendedWaitUntil:
    visible: "UAT Year Goal __UAT_TIMESTAMP__"
    timeout: 25000

# Complete one goal if visible
- tapOn:
    id: "goal-complete-button"
    optional: true

- openLink: "wrestlewell://journal"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "journal-create-button"
    timeout: 15000

# Journal create
- openLink: "wrestlewell://journal"
- waitForAnimationToEnd
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "journal-create-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "journal-create-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "journal-title-input"
    timeout: 15000
- tapOn:
    id: "journal-title-input"
- eraseText
- inputText: "UAT Journal __UAT_TIMESTAMP__"
- tapOn:
    id: "journal-mood-confident-button"
- tapOn:
    id: "journal-tag-practice-button"
- tapOn:
    id: "journal-tag-mindset-button"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "journal-body-input"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "journal-body-input"
- inputText: "UAT journal body __UAT_TIMESTAMP__"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "journal-coach-visible-toggle"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "journal-coach-visible-toggle"
- scrollUntilVisible:
    element:
      id: "journal-save-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "journal-save-button"
- waitForAnimationToEnd
- assertVisible: "UAT Journal __UAT_TIMESTAMP__"

# Journal edit
- scrollUntilVisible:
    element:
      text: "Edit"
    direction: DOWN
    timeout: 25000
- tapOn: "Edit"
- waitForAnimationToEnd
- tapOn:
    id: "journal-title-input"
- eraseText
- inputText: "UAT Journal Updated __UAT_TIMESTAMP__"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "journal-save-button"
    direction: DOWN
    timeout: 25000
- tapOn:
    id: "journal-save-button"
- waitForAnimationToEnd
- assertVisible: "UAT Journal Updated __UAT_TIMESTAMP__"

# Journal cleanup
- scrollUntilVisible:
    element:
      text: "Delete"
    direction: DOWN
    timeout: 25000
- tapOn: "Delete"
- tapOn:
    text: "Delete"
    optional: true

# Schedule
- assertVisible:
    id: "nav-schedule"
- openLink: "wrestlewell://calendar"
- extendedWaitUntil:
    visible: "Calendar"
    timeout: 25000

# Events
- assertVisible:
    id: "nav-events"
- openLink: "wrestlewell://tournaments"
- extendedWaitUntil:
    visible: "Tournaments"
    timeout: 25000

# Profile
- assertVisible:
    id: "nav-profile"
- openLink: "wrestlewell://wrestlers"
- extendedWaitUntil:
    visible: "Wrestlers"
    timeout: 25000

# Alerts
- assertVisible:
    id: "nav-alerts"
- openLink: "wrestlewell://notifications"
- extendedWaitUntil:
    visible: "Alert Inbox"
    timeout: 25000

# Manual follow-up if stable:
# - open Match-Day from tournament context
# - confirm no permission errors and only own wrestler context
