appId: __UAT_MOBILE_APP_ID__
name: Parent Smoke
---
- stopApp
- launchApp

# Close Expo login/web modal if it appears.
- tapOn:
    point: "10%,13%"
    optional: true
- tapOn:
    text: "×"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd

# Close Expo dev menu if it is open.
- tapOn:
    point: "90%,10%"
    optional: true
- tapOn:
    text: "×"
    optional: true
- tapOn:
    text: "Go home"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "http://localhost:8081"
    optional: true

- waitForAnimationToEnd

- tapOn:
    text: "Continue"
    optional: true

- openLink: "wrestlewell://uat-reset"
- waitForAnimationToEnd

- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Log In"
    optional: true

- extendedWaitUntil:
    visible:
      id: "login-email-input"
    timeout: 25000

- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "__UAT_PARENT_EMAIL__"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "__UAT_PARENT_PASSWORD__"
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "login-submit-button"

- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "OK"
    optional: true

- extendedWaitUntil:
    visible:
      id: "nav-events"
    timeout: 25000

- assertVisible:
    id: "nav-events"

# Schedule
- tapOn:
    id: "nav-schedule"
- waitForAnimationToEnd
- assertVisible: "Calendar"

# Attend
- tapOn:
    id: "nav-attend"
- waitForAnimationToEnd
- assertVisible: "Carter Yowell-Sizemore"

# Events
- tapOn:
    id: "nav-events"
- waitForAnimationToEnd
- assertVisible: "Tournaments"

# Alerts
- tapOn:
    id: "nav-alerts"
- waitForAnimationToEnd
- assertVisible: "Alert Inbox"

# Manual follow-up if tournament data is available:
# - open a linked wrestler tournament card
# - confirm Match-Day is read-only
